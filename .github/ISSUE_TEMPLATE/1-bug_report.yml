name: 🐛 Bug report
description: Something in the app crashes, freezes or doesn't work as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Hisab Sathi (हिसाब साथी)!
        **Wrong or missed SMS transaction?** Use the *SMS parsing problem* form instead. In the app, you can also open a transaction and tap **Report** to fill it in for you.
        **Never paste full account numbers, card numbers, OTPs, PINs or passwords.** Issues are public.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open Budgets, the app closes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Tap Backup → Export
        3. The app closes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About. The release file name also shows it, e.g. HisabSathi-v2.1.61-abc1234-standard-release.apk.
      placeholder: 2.1.61 (abc1234)
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Where did you install it from?
      options:
        - GitHub Releases (standard APK)
        - GitHub Releases (F-Droid / ARM-only APK)
        - F-Droid
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: Samsung Galaxy A15, Redmi Note 13, Pixel 7…
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 14
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
  - type: textarea
    id: logs
    attributes:
      label: Crash log (optional)
      description: If you can get one (e.g. `adb logcat`), paste it here. Remove any personal information first.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag and drop images or videos here. Blur balances and account details.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I removed account numbers, card numbers, OTPs and other personal information.
          required: true

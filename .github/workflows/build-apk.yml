name: Build APK

# Builds installable APKs on every push to main, on pull requests and on demand.
#
# - With the signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
#   it builds minified release APKs signed with the Hisab Sathi release key, and checks that
#   every APK carries exactly that certificate. Without them (e.g. pull requests from forks)
#   it falls back to debug-signed APKs.
# - Download APKs from the run's "Artifacts" section. Pushes to main also attest the APKs
#   with GitHub build provenance and refresh the "prebeta-latest" pre-release on the
#   Releases page.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # publish the rolling pre-release on main
      id-token: write       # build provenance attestation
      attestations: write   # build provenance attestation
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # SHA-256 of the Hisab Sathi release certificate (public; see docs/RELEASE.md).
      RELEASE_CERT_SHA256: 3631295334336a15e902f01a7602ded883f106186ea4f0dca216333f31bf984a
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # Building both flavors in one invocation disables ABI splits (see app/build.gradle.kts),
      # so each flavor produces exactly one universal APK.
      - name: Assemble signed release APKs
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease assembleFdroidRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "VARIANT=release" >> "$GITHUB_ENV"

      - name: Assemble debug APKs (no signing secrets)
        if: env.HAS_SIGNING != 'true'
        run: |
          ./gradlew assembleStandardDebug assembleFdroidDebug --no-daemon --stacktrace
          echo "VARIANT=debug" >> "$GITHUB_ENV"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APKs
        id: apks
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          for flavor in standard fdroid; do
            src=$(ls app/build/outputs/apk/$flavor/$VARIANT/*.apk)
            test "$(echo "$src" | wc -l)" -eq 1
            cp "$src" "dist/HisabSathi-v${VERSION}-${SHORT_SHA}-${flavor}-${VARIANT}.apk"
          done
          ls -la dist
          echo "name=HisabSathi-v${VERSION}-${SHORT_SHA}-${VARIANT}-apks" >> "$GITHUB_OUTPUT"

      - name: Verify signatures
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | tee certs.txt
            if [ "$VARIANT" = "release" ]; then
              expected=$(echo "$RELEASE_CERT_SHA256" | tr -d ' ')
              grep -qi "certificate SHA-256 digest: $expected" certs.txt \
                || { echo "::error::$apk is not signed with the Hisab Sathi release key"; exit 1; }
              if "$BT/aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
                echo "::error::$apk is debuggable"; exit 1
              fi
            fi
          done

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # On every push to main, replace the rolling "prebeta-latest" pre-release on the
      # Releases page with this commit's APKs, so there is always one public download link.
      # The tag does not start with "v", so it never triggers release.yml.
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(git rev-parse --short HEAD)
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          if [ "$VARIANT" = "release" ]; then
            SIGNING="Signed with the Hisab Sathi release key (certificate SHA-256 \`$(echo "$RELEASE_CERT_SHA256" | tr -d ' ')\`) and attested by GitHub: verify with \`gh attestation verify <apk> --repo ${GITHUB_REPOSITORY}\`."
          else
            SIGNING="Debug-signed test build: Android will ask you to allow installing from this source."
          fi
          cat > notes.md <<NOTES
          Latest Hisab Sathi (हिसाब साथी) pre-beta, built automatically from \`main\` at ${SHORT_SHA} (version ${VERSION}).

          - **…-standard-${VARIANT}.apk**: use this one on your phone.
          - **…-fdroid-${VARIANT}.apk**: ARM-only, no Google Play services.
          - \`SHA256SUMS.txt\`: checksums.

          ${SIGNING}

          If you installed an earlier debug build, uninstall it first: Android cannot update an app whose signature changed.
          This release is replaced on every merge to \`main\`.
          NOTES
          gh release delete prebeta-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create prebeta-latest dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest pre-beta (${VERSION}, ${SHORT_SHA})" --notes-file notes.md

name: Build APK

# Builds installable debug APKs on every push to main, on pull requests and on demand.
# Download them from the run's "Artifacts" section. These are debug-signed (no keystore
# needed); signed release builds go through release.yml, which needs the KEYSTORE_BASE64,
# KEYSTORE_PASSWORD and KEY_ALIAS repository secrets.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Building both flavors in one invocation disables ABI splits (see app/build.gradle.kts),
      # so each flavor produces exactly one universal APK.
      - name: Assemble standard and F-Droid debug APKs
        run: ./gradlew assembleStandardDebug assembleFdroidDebug --no-daemon --stacktrace

      - name: Rename APKs
        id: apks
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/*.apk "dist/HisabSathi-v${VERSION}-${SHORT_SHA}-standard-debug.apk"
          cp app/build/outputs/apk/fdroid/debug/*.apk "dist/HisabSathi-v${VERSION}-${SHORT_SHA}-fdroid-debug.apk"
          ls -la dist
          echo "name=HisabSathi-v${VERSION}-${SHORT_SHA}-debug-apks" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apks.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
